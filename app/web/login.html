<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>FrishLuna · 登录</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="login.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%237aa2ff'/%3E%3Ccircle cx='21' cy='12' r='11' fill='%230a0b0f'/%3E%3C/svg%3E">
</head>
<body class="login-body">
  <canvas id="fl-bg" aria-hidden="true"></canvas>

  <div class="login-scene">
    <div class="login-card" id="login-card">
      <div class="login-logo">
        <svg viewBox="0 0 32 32" width="42" height="42" aria-hidden="true">
          <defs>
            <linearGradient id="lgl" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#8fb4ff"/><stop offset="1" stop-color="#a78bfa"/>
            </linearGradient>
          </defs>
          <path fill="url(#lgl)" d="M16 2a14 14 0 1 0 12.1 21L16 16z"/>
          <circle cx="22.5" cy="9.5" r="1.6" fill="#c9d8ff" opacity=".9"/>
          <circle cx="27" cy="15" r="1" fill="#c9d8ff" opacity=".7"/>
        </svg>
        <span class="logo-ring"></span>
      </div>

      <h1 id="login-title">FrishLuna</h1>
      <p class="login-sub" id="login-sub">输入访问令牌进入控制面板</p>

      <form class="login-form" id="login-form" autocomplete="off">
        <label class="pw-field">
          <svg viewBox="0 0 24 24"><path d="M14.5 3.5a5.5 5.5 0 0 0-5.2 7.3L3.5 16.6V20h3.4l1.2-1.2v-1.9h1.9l1.2-1.2v-1.6h1.6l2.4-2.4a5.5 5.5 0 0 0-.7-8.7z"/><circle cx="16.6" cy="7.4" r="1.3"/></svg>
          <input id="login-token" type="password" placeholder=" " spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off">
          <span class="pw-label" id="pw-label">访问令牌</span>
          <button type="button" class="pw-eye" id="token-paste" title="从剪贴板粘贴" tabindex="-1">
            <svg viewBox="0 0 24 24"><rect x="8" y="3.5" width="8" height="4" rx="1.4"/><path d="M16 5.5h2.5A1.5 1.5 0 0 1 20 7v12.5A1.5 1.5 0 0 1 18.5 21h-13A1.5 1.5 0 0 1 4 19.5V7a1.5 1.5 0 0 1 1.5-1.5H8"/></svg>
          </button>
        </label>

        <button class="login-btn" id="login-btn" type="submit">
          <span id="login-btn-text">进入面板</span>
          <svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
        </button>
      </form>

      <p class="login-msg" id="login-msg"></p>

      <div class="setup-block" id="setup-block" hidden>
        <p class="setup-tip">初始令牌登录成功，请设置一个属于你自己的访问令牌（设完初始令牌即刻作废）</p>
        <label class="pw-field">
          <svg viewBox="0 0 24 24"><path d="M14.5 3.5a5.5 5.5 0 0 0-5.2 7.3L3.5 16.6V20h3.4l1.2-1.2v-1.9h1.9l1.2-1.2v-1.6h1.6l2.4-2.4a5.5 5.5 0 0 0-.7-8.7z"/><circle cx="16.6" cy="7.4" r="1.3"/></svg>
          <input id="setup-token" type="password" placeholder=" " spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" maxlength="64">
          <span class="pw-label" id="setup-label">新访问令牌（至少 8 位，字母 + 数字）</span>
        </label>
        <div class="pw-meter" id="setup-meter" data-level="none">
          <i></i><i></i><i></i>
          <span class="pw-meter-label" id="setup-level">未达到要求</span>
        </div>
        <p class="pw-hint" id="setup-hint">必须同时含字母和数字</p>
        <div class="setup-actions">
          <button class="btn-ghost" id="setup-gen" type="button">随机生成</button>
          <button class="login-btn" id="setup-save" type="button">
            <span id="setup-save-text">保存并进入</span>
            <svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
          </button>
        </div>
        <p class="login-msg" id="setup-msg"></p>
      </div>
    </div>

    <div class="login-deco d1"></div>
    <div class="login-deco d2"></div>
    <div class="login-deco d3"></div>
  </div>

  <script src="login.js"></script>
</body>
</html>
