[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:qq]
command=/opt/QQ/qq --no-sandbox --disable-gpu --disable-gpu-sandbox --disable-dev-shm-usage --disable-software-rasterizer
directory=/app
user=frishluna
priority=10
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOME="/app",DISPLAY="%(ENV_DISPLAY)s",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s",FL_RUNTIME_DIR="%(ENV_FL_RUNTIME_DIR)s"

[program:inject]
; 迟注入：QQ 启动极早期被 LD_PRELOAD 注入会在初始化时 SIGTRAP 崩溃，改为进程
; 起来后由本常驻脚本 ptrace 注入（见 inject-once.sh）。需 root 才能 ptrace，故不设 user。
command=/bin/sh /opt/frishluna/inject-once.sh
directory=/app
priority=15
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOME="/app",DISPLAY="%(ENV_DISPLAY)s",FL_RUNTIME_DIR="%(ENV_FL_RUNTIME_DIR)s"

[program:frishluna]
command=/usr/local/bin/node /opt/frishluna/app/server/index.js
directory=/opt/frishluna/app
user=frishluna
priority=20
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOME="/app",DISPLAY="%(ENV_DISPLAY)s",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s",FL_RUNTIME_DIR="%(ENV_FL_RUNTIME_DIR)s",FL_PANEL_HOST="%(ENV_FL_PANEL_HOST)s",FL_PANEL_PORT="%(ENV_FL_PANEL_PORT)s",FL_ONEBOT_PORT="%(ENV_FL_ONEBOT_PORT)s",FL_ONEBOT_HOST="%(ENV_FL_ONEBOT_HOST)s",FL_NO_OPEN="1"
