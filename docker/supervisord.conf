[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:qq]
command=/opt/QQ/qq --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-software-rasterizer
directory=/app
user=frishluna
priority=10
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOME="/app",DISPLAY="%(ENV_DISPLAY)s",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s",FL_RUNTIME_DIR="%(ENV_FL_RUNTIME_DIR)s",LD_PRELOAD="/opt/frishluna/payload/libfrishluna-payload.so"

[program:frishluna]
command=/usr/local/bin/node /opt/frishluna/app/server/index.js
directory=/opt/frishluna/app
user=frishluna
priority=20
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOME="/app",DISPLAY="%(ENV_DISPLAY)s",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s",FL_RUNTIME_DIR="%(ENV_FL_RUNTIME_DIR)s",FL_PANEL_HOST="%(ENV_FL_PANEL_HOST)s",FL_PANEL_PORT="%(ENV_FL_PANEL_PORT)s",FL_ONEBOT_PORT="%(ENV_FL_ONEBOT_PORT)s",FL_ONEBOT_HOST="%(ENV_FL_ONEBOT_HOST)s",FL_NO_OPEN="1"
